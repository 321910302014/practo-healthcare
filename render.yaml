# Render Blueprint for PRACTO — deploys all three apps from this repo.
# Docs: https://render.com/docs/blueprint-spec
#
# Services:
#   practo-backend   Node/Express API   (rootDir PRACTO-main/backend)
#   practo-frontend  Vite static site   (rootDir PRACTO-main/frontend)  — patient app
#   practo-admin     Vite static site   (rootDir admin)                 — admin/doctor panel
#
# After the first deploy, set VITE_BACKEND_URL on both static sites to the
# backend's URL (e.g. https://practo-backend.onrender.com) and redeploy them.

services:
  # ---------------------------------------------------------------------------
  # 1) Backend API. Secrets load from the committed PRACTO-main/backend/.env,
  #    so no env vars are required here. Render injects PORT, which
  #    server.js already honours (process.env.PORT || 4000).
  # ---------------------------------------------------------------------------
  - name: practo-backend
    type: web
    runtime: node
    rootDir: PRACTO-main/backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /

  # ---------------------------------------------------------------------------
  # 2) Patient frontend (Vite → static). The SPA rewrite makes deep links
  #    like /verify and /my-appointments serve index.html instead of 404ing.
  # ---------------------------------------------------------------------------
  - name: practo-frontend
    type: web
    runtime: static
    rootDir: PRACTO-main/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        sync: false # set to your practo-backend URL, then redeploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ---------------------------------------------------------------------------
  # 3) Admin / Doctor panel (Vite → static).
  # ---------------------------------------------------------------------------
  - name: practo-admin
    type: web
    runtime: static
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        sync: false # set to your practo-backend URL, then redeploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
